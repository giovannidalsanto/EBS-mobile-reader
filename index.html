<style>
:root{
  --bg:#0A0E1A; --surface:#121829; --line:#222A42; --text:#E8ECF5;
  --muted:#8B93AD; --faint:#5A6280; --red:#E5484D; --ebs:#5B8DEF; --ebsplus:#9B8CFF;
  --ep:#FFCC00; --epblue:#3B5BDB;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:10;background:rgba(15,19,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);border-top:2px solid #000099;padding:12px 16px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.14em;font-stretch:115%;text-transform:uppercase}
.daynav{display:flex;align-items:center;gap:2px}
.daynav button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);
  font-family:var(--mono);font-size:14px;width:30px;height:28px;cursor:pointer;line-height:1}
.daynav button:disabled{opacity:.3;cursor:default}
.daynav button:focus-visible{outline:2px solid var(--ebs);outline-offset:2px}
.daynav .day{font-family:var(--mono);font-size:12.5px;color:var(--text);min-width:108px;text-align:center}
.daynav .day.today{color:var(--red)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px}
.chips{display:flex;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:transparent;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--muted);background:var(--surface)}
.chip:focus-visible{outline:2px solid var(--ebs);outline-offset:2px}
.updated{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
main{max-width:560px;margin:0 auto;padding:4px 16px 80px}
.tz{font-family:var(--mono);font-size:11px;color:var(--faint);padding:12px 0 4px;text-align:right}

.event{display:grid;grid-template-columns:52px 14px 1fr;gap:0 10px;padding:14px 0;position:relative}
.event+.event{border-top:1px solid var(--line)}
.event.past{opacity:.42}
.time{font-family:var(--mono);font-size:15px;font-weight:600;padding-top:1px}
.dur{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line)}
.node{position:absolute;left:2.5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--muted)}
.event.onair .node{background:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion: no-preference){
  .event.onair .node{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 5px rgba(229,72,77,.18)}}
}
.flags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.flag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:2px 7px;border-radius:3px}
.flag.live{background:var(--red);color:#fff;font-weight:600}
.flag.rec{border:1px solid var(--muted);color:var(--muted)}
.flag.edit{border:1px solid var(--line);color:var(--faint)}
.flag.ch-EBS{color:var(--ebs);border:1px solid currentColor}
.flag.ch-EBSplus{color:var(--ebsplus);border:1px solid currentColor}
.event.ep .rail::before{background:var(--ep)}
.event.ep .node{border-color:var(--ep);background:var(--ep)}
.event.ep{background:linear-gradient(90deg, rgba(255,204,0,.05), transparent 60%)}
.flag.epflag{color:var(--ep);border:1px solid currentColor}
a.ref{font-family:var(--mono);font-size:10.5px;color:var(--ebs);text-decoration:none;border-bottom:1px dotted var(--ebs)}
.sub .inst{color:var(--faint)}
footer a{color:var(--muted)}
.newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC38A;margin-right:7px;vertical-align:1px;transition:opacity 60s linear}
.title{font-size:15.5px;font-weight:600;line-height:1.35}
.langs{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px;word-spacing:2px}
details{margin-top:7px}
summary{font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none}
summary::before{content:"+ ";color:var(--faint)}
details[open] summary::before{content:"− "}
summary:focus-visible{outline:2px solid var(--ebs);outline-offset:2px}
.sub{padding:8px 0 2px 2px;border-left:2px solid var(--line);margin:8px 0 0 2px}
.sub>div{padding:5px 0 5px 10px}
.sub .ref{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.sub .st{font-size:13.5px;color:var(--text)}
.sub .ss{font-size:12.5px;color:var(--muted);margin-top:2px}

.playhead{display:grid;grid-template-columns:52px 1fr;gap:0 10px;align-items:center;padding:2px 0}
.playhead .now{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--red);letter-spacing:.1em}
.playhead .line{height:1.5px;background:var(--red);box-shadow:0 0 6px rgba(229,72,77,.5)}
.empty{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
footer{max-width:560px;margin:0 auto;padding:0 16px 40px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
</style>
</head>

let pendingScroll = true;
const NEW_WINDOW_MS = 12*3600*1000;   // how recently the robot must have first seen it
const NEW_FADE_MS = 150000;           // ~2.5 min visible fade after opening
const NEW_HARD_CAP_MS = 3600000;      // absolute ceiling: dot cannot persist beyond 1h on screen
const newShownAt = new Map();
const newExpired = new Set();
const evKey = e => e.start + "|" + e.channel + "|" + e.title;
let pendingToday = false;
let FEED = EMBEDDED, filter = "ALL", dayIdx = 0, days = [];
const TZ = "Europe/Brussels";

const fmtT = d => new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:TZ}).format(d);
const fmtDayLong = d => new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"2-digit",month:"short",timeZone:TZ}).format(d).toUpperCase();
const dayKey = d => new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:TZ}).format(d);
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chName = c => c==="EBS"?"EBS":"EBS+";

function refLine(s){
  if(!s.ref) return "";
  const tag = s.inst ? ' <span class="inst">\u00b7 ' + esc(s.inst) + '</span>' : "";
  if(s.mmc && s.mmc.indexOf("https://multimedia.europarl.europa.eu/") === 0){
    return '<div><a class="ref" href="' + esc(s.mmc) + '" target="_blank" rel="noopener">' + esc(s.ref) + ' \u2197</a>' + tag + '</div>';
  }
  return '<div class="ref">' + esc(s.ref) + tag + '</div>';
}
function statusFlag(s){
  if(s==="LIVE") return '<span class="flag live">LIVE</span>';
  if(s==="RECORDED"||s==="EDIT_RECORDED") return '<span class="flag rec">RECORDED</span>';
  return '<span class="flag edit">EDIT</span>';
}
function durTxt(sec){
  if(!sec) return "";
  const m = Math.round(sec/60);
  return m>=60 ? Math.floor(m/60)+"h"+String(m%60).padStart(2,"0") : m+"′";
}
function rebuildDays(){
  const keys = [...new Set(FEED.events.map(e => dayKey(new Date(e.start))))].sort();
  days = keys;
  const todayK = dayKey(new Date());
  const want = days.indexOf(todayK);
  dayIdx = want >= 0 ? want : 0;
}
function render(){
  const now = new Date();
  const todayK = dayKey(now);
  const selKey = days[dayIdx];
  const evs = FEED.events.filter(e =>
    dayKey(new Date(e.start)) === selKey &&
    (filter==="ALL" || chName(e.channel)===filter));
  const isToday = selKey === todayK;

  const dayEl = document.getElementById("day");
  if(selKey){
    dayEl.textContent = fmtDayLong(new Date(selKey+"T12:00:00Z")) + (isToday ? " ·" : "");
    dayEl.classList.toggle("today", isToday);
  }
  document.getElementById("prev").disabled = dayIdx <= 0;
  document.getElementById("next").disabled = dayIdx >= days.length-1;
  if(FEED.generatedAt) document.getElementById("updated").textContent = "upd " + fmtT(new Date(FEED.generatedAt));

  const list = document.getElementById("list");
  if(!evs.length){ list.innerHTML = '<div class="empty">Nothing scheduled here yet.</div>'; return; }

  let html = "", placed = !isToday;
  for(const e of evs){
    const st = new Date(e.start), en = new Date(st.getTime() + (e.durationSec||0)*1000);
    const onair = isToday && now>=st && now<=en && e.status==="LIVE";
    const past = en<now && !onair;
    if(!placed && st>now){
      html += `<div class="playhead" aria-label="current time"><span class="now">${fmtT(now)} ▸</span><span class="line"></span></div>`;
      placed = true;
    }
    const cls = "event" + (past?" past":"") + (onair?" onair":"") + (e.ep?" ep":"");
    let nd = "";
    if(e.firstSeen){
      const k = evKey(e);
      const age = now - new Date(e.firstSeen);
      if(age >= 0 && age < NEW_WINDOW_MS && !newExpired.has(k)){
        if(!newShownAt.has(k)) newShownAt.set(k, Date.now());
        const shownFor = Date.now() - newShownAt.get(k);
        const op = Math.max(0, 1 - shownFor / NEW_FADE_MS);
        if(op <= 0.02 || shownFor >= NEW_HARD_CAP_MS) newExpired.add(k);
        else nd = '<span class="newdot" style="opacity:' + op.toFixed(2) + '" aria-label="recently added"></span>';
      }
    }
    const subs = (e.items||[]).filter(s=>s.title||s.summary);
    html += `<article class="${cls}">
      <div><div class="time">${fmtT(st)}</div><div class="dur">${durTxt(e.durationSec)}</div></div>
      <div class="rail"><span class="node"></span></div>
      <div>
        <div class="flags">${statusFlag(e.status)}<span class="flag ch-${e.channel==="EBS"?"EBS":"EBSplus"}">${chName(e.channel)}</span>${e.ep?'<span class="flag epflag">EP</span>':""}</div>
        <div class="title">${nd}${esc(e.title)}</div>
        ${e.languages&&e.languages.length>1?`<div class="langs">${e.languages.join(" ")}</div>`:""}
        ${subs.length?`<details><summary>${subs.length} item${subs.length>1?"s":""}</summary><div class="sub">${
          subs.map(s=>`<div>${refLine(s)}<div class="st">${esc(s.title)}</div>${s.summary&&s.summary!==s.title?`<div class="ss">${esc(s.summary)}</div>`:""}</div>`).join("")
        }</div></details>`:""}
      </div>
    </article>`;
  }
  if(isToday && !placed) html += `<div class="playhead"><span class="now">${fmtT(now)} ▸</span><span class="line"></span></div>`;
  list.innerHTML = html;
  if(pendingScroll){
    pendingScroll = false;
    if(isToday){
      const ph = list.querySelector(".playhead");
      if(ph) ph.scrollIntoView({block:"center"});
    }
  }
}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  filter = b.dataset.ch;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b ? "true":"false"));
  render();
}));
document.getElementById("prev").addEventListener("click",()=>{ if(dayIdx>0){dayIdx--; render();} });
document.getElementById("next").addEventListener("click",()=>{ if(dayIdx<days.length-1){dayIdx++; render();} });
async function refresh(){
  try{
    const r = await fetch("feed.json?t="+Date.now(), {cache:"no-store"});
    if(r.ok){
      const sel = days[dayIdx];
      FEED = await r.json();
      rebuildDays();
      if(pendingToday){ pendingToday = false; }
      else { const keep = days.indexOf(sel); if(keep >= 0) dayIdx = keep; }
    }
  }catch(_){/* offline or local file: keep embedded data */}
  render();
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ pendingScroll = true; pendingToday = true; newShownAt.clear(); newExpired.clear(); refresh(); } });
rebuildDays();
refresh();
setInterval(refresh, 5*60*1000);
setInterval(render, 60*1000); // keep playhead and dimming current
</script>
