name: Update EBS feed
on:
  schedule:
    - cron: "*/30 4-16 * * 1-5"
    - cron: "0 2 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - name: Build feed
        run: python build_feed.py
      - name: Commit if changed
        run: |
          git config user.name "ebs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "feed update"
          git push
